<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
  <title>Réinitialiser le mot de passe — CapCut Studio · GUELICHWEB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/portal-brand.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p.lead { margin: 0 0 22px; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-input);
      color: var(--text);
      font: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8a7344);
      color: var(--on-accent);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error, .success {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .error { border: 1px solid rgba(220, 76, 76, 0.4); background: rgba(220, 76, 76, 0.1); color: #f5a5a5; }
    .success { border: 1px solid rgba(76, 175, 122, 0.4); background: rgba(76, 175, 122, 0.1); color: #9fd4b5; }
    .error.visible, .success.visible { display: block; }
    .footer-links { margin-top: 18px; text-align: center; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--accent); text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
    .hint { font-size: 0.75rem; color: var(--muted); margin: -10px 0 14px; }
  </style>
</head>
<body class="has-brand-footer">
  <div class="card">
    <span class="badge">CapCut Studio · <span class="brand-nowrap">GUELICHWEB</span></span>
    <h1>Nouveau mot de passe</h1>
    <p class="lead">Choisissez un nouveau mot de passe pour votre compte.</p>

    <div id="error" class="error" role="alert"></div>
    <div id="success" class="success" role="status"></div>

    <form id="reset-form">
      <label for="password">Nouveau mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="••••••••" />
      <p class="hint">Minimum 8 caractères</p>

      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="••••••••" />

      <button type="submit" id="submit-btn">Enregistrer</button>
    </form>

    <p class="footer-links">
      <a href="/connexion">Retour à la connexion</a> · <a href="/mot-de-passe-oublie">Demander un nouveau lien</a>
    </p>
  </div>

  <footer class="guelichweb-footer" role="contentinfo">
    <div class="brand-footer">
      <span class="brand-footer-label">Propulsé par</span>
      <a class="brand-logo" href="https://guelichweb.store" target="_blank" rel="noopener noreferrer" aria-label="GUELICHWEB">
        <img src="/brand/guelichweb-horizontal.png" alt="GUELICHWEB" width="140" height="28" loading="lazy" />
      </a>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const form = document.getElementById("reset-form");
    const submitBtn = document.getElementById("submit-btn");

    if (!token) {
      errorEl.textContent = "Lien invalide. Demandez un nouveau lien de réinitialisation.";
      errorEl.classList.add("visible");
      submitBtn.disabled = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("visible");
      successEl.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Enregistrement…";

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            password: document.getElementById("password").value,
            confirmPassword: document.getElementById("confirmPassword").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || "Impossible de réinitialiser le mot de passe.";
          errorEl.classList.add("visible");
          return;
        }
        successEl.textContent = data.message || "Mot de passe mis à jour.";
        successEl.classList.add("visible");
        form.reset();
        setTimeout(() => {
          location.href = data.redirectTo || "/connexion?reset=1";
        }, 1200);
      } catch {
        errorEl.textContent = "Erreur réseau. Réessayez.";
        errorEl.classList.add("visible");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Enregistrer";
      }
    });
  </script>
</body>
</html>
