<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mot de passe oublié — CapCut Studio · Guelich Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #171d17;
      --border: #30382f;
      --text: #f4f2e8;
      --muted: #9ca493;
      --accent: #aa9158;
      --error: #dc4c4c;
      --success: #4caf7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(170, 145, 88, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(48, 56, 47, 0.55), transparent);
      pointer-events: none;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p.lead { margin: 0 0 22px; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f120f;
      color: var(--text);
      font: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8a7344);
      color: #0a0a0a;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error, .success {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .error { border: 1px solid rgba(220, 76, 76, 0.4); background: rgba(220, 76, 76, 0.1); color: #f5a5a5; }
    .success { border: 1px solid rgba(76, 175, 122, 0.4); background: rgba(76, 175, 122, 0.1); color: #9fd4b5; }
    .error.visible, .success.visible { display: block; }
    .footer-links { margin-top: 18px; text-align: center; font-size: 0.85rem; color: var(--muted); }
    .footer-links a { color: var(--accent); text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">CapCut Studio</span>
    <h1>Mot de passe oublié</h1>
    <p class="lead">Entrez votre email. Si un compte existe, nous vous enverrons un lien de réinitialisation.</p>

    <div id="error" class="error" role="alert"></div>
    <div id="success" class="success" role="status"></div>

    <form id="forgot-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="vous@email.com" />
      <button type="submit" id="submit-btn">Envoyer le lien</button>
    </form>

    <p class="footer-links">
      <a href="/connexion">Retour à la connexion</a>
    </p>
  </div>

  <script>
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const form = document.getElementById("forgot-form");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.remove("visible");
      successEl.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Envoi…";

      try {
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: document.getElementById("email").value }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || "Impossible d'envoyer le lien.";
          errorEl.classList.add("visible");
          return;
        }
        successEl.textContent = data.message || "Si un compte existe, un email vient d'être envoyé.";
        successEl.classList.add("visible");
        form.reset();
      } catch {
        errorEl.textContent = "Erreur réseau. Réessayez.";
        errorEl.classList.add("visible");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Envoyer le lien";
      }
    });
  </script>
</body>
</html>
