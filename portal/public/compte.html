<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mon compte — CapCut Studio · GUELICHWEB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/portal-brand.css" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #171d17;
      --border: #30382f;
      --text: #f4f2e8;
      --muted: #9ca493;
      --accent: #aa9158;
      --error: #dc4c4c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 24px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(170, 145, 88, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(48, 56, 47, 0.55), transparent);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      margin-top: 24px;
    }
    .card p { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
    .card .email { color: var(--text); font-weight: 500; }
    a.btn {
      display: inline-block;
      margin-top: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8a7344);
      color: #0a0a0a;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    a.link {
      display: inline-block;
      margin-top: 20px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.875rem;
    }
    a.link:hover { text-decoration: underline; }
    a.danger {
      display: inline-block;
      margin-top: 24px;
      color: #f5a5a5;
      font-size: 0.85rem;
      text-decoration: none;
    }
    a.danger:hover { text-decoration: underline; }
    .back { color: var(--muted); text-decoration: none; font-size: 0.875rem; display: inline-block; margin-bottom: 20px; }
    .back:hover { color: var(--accent); }
  </style>
</head>
<body class="has-brand-footer">
  <div class="wrap">
    <a href="/index.html" class="back">← Retour à l'éditeur</a>
    <span class="badge">CapCut Studio · <span class="brand-nowrap">GUELICHWEB</span></span>
    <h1>Mon compte</h1>

    <div class="card">
      <p>Connecté en tant que <span class="email" id="user-email">…</span></p>
      <p id="sub-info" style="display:none;"></p>
      <a href="/index.html" class="btn">Ouvrir l'éditeur</a>
    </div>

    <a href="/supprimer-mon-compte" class="danger">Supprimer mon compte</a>
    <br />
    <a href="#" class="link" id="logout-link">Se déconnecter</a>
  </div>

  <footer class="guelichweb-footer" role="contentinfo">
    <p>Propulsé par <span class="brand-name brand-nowrap">GUELICHWEB</span></p>
  </footer>

  <script>
    fetch("/api/auth/session").then((r) => r.json()).then((data) => {
      if (!data.authenticated) {
        location.href = "/connexion?next=/compte";
        return;
      }
      document.getElementById("user-email").textContent = data.user.email;
      if (data.subscription?.plan) {
        const el = document.getElementById("sub-info");
        el.style.display = "block";
        el.textContent = "Forfait : " + data.subscription.plan.name;
      }
    }).catch(() => { location.href = "/connexion?next=/compte"; });

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST" });
      location.href = "/connexion";
    });
  </script>
</body>
</html>
